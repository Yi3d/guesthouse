[package]
name = "guesthouse-backend-intel"
description = "The Intel backend: the guest's work on the host's xe driver, and the private data Intel's Windows driver sends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
guesthouse-backend.workspace = true
guesthouse-messages.workspace = true
# ioctl, which the standard library does not offer. Same as the other backends.
libc = "0.2"
# The facade, as in the core.
log = "0.4"

[dev-dependencies]
guesthouse-backend-standin.workspace = true
guesthouse-core.workspace = true

[[bin]]
# Prints what the host's xe driver says about the card, for a tester to paste. By itself it only
# reads. With --run it also runs the host's self-test: a few tiny buffers and batches of its own.
name = "intel-probe"
path = "src/bin/intel_probe.rs"

[lints]
workspace = true
